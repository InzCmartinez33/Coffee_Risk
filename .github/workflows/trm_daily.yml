- name: Guardar cambios y subirlos a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verifica si el archivo existe antes de añadirlo
          if [ -f datos_trm.json ]; then
            git add datos_trm.json
            git commit -m "🤖 Auto-actualización diaria TRM [8:00 PM Colombia]" || exit 0
            git push
          else
            echo "⚠️ El archivo datos_trm.json no fue generado por el script de Python."
            exit 1
          fi
