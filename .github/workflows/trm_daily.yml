name: Actualizador Diario de TRM

on:
  schedule:
    # 1:00 AM UTC = 8:00 PM Hora Colombia (UTC-5)
    - cron: '0 1 * * *'
  workflow_dispatch: # Permite ejecución manual

permissions:
  contents: write # Otorga permisos explícitos de escritura

jobs:
  actualizar-trm:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v3
        with:
          persist-credentials: true # Clave para solucionar el Error 128

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Ejecutar script de TRM
        run: python actualizar_trm.py

      - name: Guardar cambios y subirlos a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_trm.json
          git commit -m "🤖 Auto-actualización diaria TRM [8:00 PM Colombia]" || exit 0
          git push
